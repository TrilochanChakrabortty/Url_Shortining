# networks:

#   url-shortener-network:
#     driver: bridge

services:

  # ============================================================
  # API INSTANCE 1
  # ============================================================

  api-1:
    build: .

    restart: unless-stopped

    environment:
      INSTANCE_ID: "api-1"

      # --------------------------------------------------------
      # DATABASE
      # --------------------------------------------------------

      DB_USER: "${DB_USER}"
      DB_PASSWORD_ENCRYPTED: "${DB_PASSWORD_ENCRYPTED}"
      DB_ENCRYPTION_KEY: "${DB_ENCRYPTION_KEY}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"

      # --------------------------------------------------------
      # REDIS
      # --------------------------------------------------------

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"

      # --------------------------------------------------------
      # JWT
      # --------------------------------------------------------

      SECRET_KEY: "${SECRET_KEY}"

    expose:
      - "8000"

    depends_on:
      - redis

    networks:
      - url-shortener-network


  # ============================================================
  # API INSTANCE 2
  # ============================================================

  api-2:
    build: .

    restart: unless-stopped

    environment:
      INSTANCE_ID: "api-2"

      # --------------------------------------------------------
      # DATABASE
      # --------------------------------------------------------

      DB_USER: "${DB_USER}"
      DB_PASSWORD_ENCRYPTED: "${DB_PASSWORD_ENCRYPTED}"
      DB_ENCRYPTION_KEY: "${DB_ENCRYPTION_KEY}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"

      # --------------------------------------------------------
      # REDIS
      # --------------------------------------------------------

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"

      # --------------------------------------------------------
      # JWT
      # --------------------------------------------------------

      SECRET_KEY: "${SECRET_KEY}"

    expose:
      - "8000"

    depends_on:
      - redis

    networks:
      - url-shortener-network


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine

    container_name: url-shortener-redis

    restart: unless-stopped

    networks:
      - url-shortener-network


  # ============================================================
  # NGINX LOAD BALANCER
  # ============================================================

  nginx:
    image: nginx:alpine

    container_name: url-shortener-nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api-1
      - api-2

    networks:
      - url-shortener-network


# ==============================================================
# NETWORK
# ==============================================================

networks:

  url-shortener-network:
    driver: bridge